name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（typecheck / lint / test / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖（锁文件冻结）
        run: pnpm install --frozen-lockfile

      - name: 类型检查（含 vite/vitest 配置）
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: 单元/组件测试
        run: pnpm test

      - name: 构建脚本单测（node:test）
        run: pnpm test:scripts

      - name: 生产构建
        run: pnpm build

  rust:
    name: Rust（fmt / clippy / test）
    # Tauri 在 Windows 上的链接依赖 MSVC 与 WebView2，windows-latest 均自带。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy（warnings 视为错误）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  docs:
    name: 文档与脱敏门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 敏感信息 / 链接 / 文档与代码一致性
        run: node scripts/check-public-repo.mjs
