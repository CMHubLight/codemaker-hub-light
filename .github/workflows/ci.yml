name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 默认 GITHUB_TOKEN 只读：CI 只需要读仓库内容（写权限只留给签名工作流）。
permissions:
  contents: read

jobs:
  frontend:
    name: 前端（typecheck / lint / test / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖（锁文件冻结）
        run: pnpm install --frozen-lockfile

      - name: 类型检查（含 vite/vitest 配置）
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: 单元/组件测试
        run: pnpm test

      - name: 构建脚本单测（node:test）
        run: pnpm test:scripts

      - name: 生产构建
        run: pnpm build

  rust:
    name: Rust（fmt / clippy / test）
    # Tauri 在 Windows 上的链接依赖 MSVC 与 WebView2，windows-latest 均自带。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支，2026-11-11
        with:
          # SHA 固定后不再跟随上游更新；显式声明 toolchain 避免默认值漂移。
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy（warnings 视为错误）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  docs:
    name: 文档与脱敏门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 敏感信息 / 链接 / 文档与代码一致性
        run: node scripts/check-public-repo.mjs
