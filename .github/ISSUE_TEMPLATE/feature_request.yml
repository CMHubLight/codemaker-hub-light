name: Feature request
description: 提出功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先确认这个需求属于本项目的范围：账号登录 / 本地代理（协议转发与鉴权注入）/ 用量统计。
        不在范围内：Agent 编排、聊天会话、插件市场、定时任务、自动更新。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你正在做什么、卡在哪一步；越具体越好
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 你希望应用怎么表现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 现在你是怎么绕过这个问题的
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 登录 / 凭据
        - 本地代理
        - 用量统计 / 导出
        - 设置 / 托盘 / 窗口
        - 文档
        - 其他
    validations:
      required: true
