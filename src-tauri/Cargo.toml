[package]
name = "codemaker-hub-light"
version = "0.1.0"
description = "账号登录、本地代理与用量统计桌面应用"
authors = ["codemaker-hub-light contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/CMHubLight/codemaker-hub-light"
edition = "2021"

[lib]
# 后端逻辑全部放在 lib 中，`main.rs` 只调用 `run()`；桌面端（NSIS）只需 rlib，
# staticlib/cdylib 是移动端目标才需要的产物，这里不再构建。
name = "codemaker_hub_light_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri 2 应用骨架 ---
tauri = { version = "2", features = ["tray-icon"] }
# 系统浏览器打开登录页、打开日志目录（前端也可用）
tauri-plugin-opener = "2"
# 深链：codemakerhub-light://auth/callback
tauri-plugin-deep-link = "2"
# 单实例：二次启动聚焦已有窗口
tauri-plugin-single-instance = "2"

# --- 序列化 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- 异步运行时 / HTTP ---
tokio = { version = "1", features = ["full"] }
# 代理 SSE 透传：mpsc → Body stream
tokio-stream = "0.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# --- 本地存储 ---
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# --- 工具 ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# --- P1 认证：加密存储 / 系统凭据库 / 文件锁 / 随机数 ---
aes-gcm = "0.10"
getrandom = "0.2"
fs2 = "0.4"
keyring = { version = "3", features = ["windows-native"] }

# --- 平台相关：启动失败弹窗（release 无控制台，否则等于无声退出） ---
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# 启用后 release 可执行文件才内嵌 frontendDist（dist/）。
# `pnpm tauri build` / `tauri build` 会自动加上；只跑 `cargo build --release`
# 会缺少它，运行时退回 build.devUrl（http://localhost:5173）并显示连接被拒绝。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
